# =============================================================================
# RoleMiner — Search Profile
# Edit this file to match your background. Run: python main.py run
# =============================================================================

# YOUR TECH STACK
# Used in two places:
#   1. Sent to LLM as "Stack: ..." so it knows what skills you have
#   2. Used in TF-IDF pre-rank to score keyword overlap with job descriptions
# Add everything you can work with — the LLM will judge fit, not just keywords.
skills:
  - React
  - TypeScript
  - Node.js
  - Python
  - GraphQL
  - PostgreSQL

# WHERE YOU'LL WORK
# A job passes if its location string contains ANY of these (case-insensitive).
# Example: "Bangalore, Karnataka" matches "Bangalore"
# "Remote" is special — see work_mode below.
# Valid city names: Bangalore, Hyderabad, Mumbai, NCR, Pune, Chennai, Remote
locations:
  - Bangalore
  - Hyderabad
  - Mumbai
  - NCR
  - Remote

# MINIMUM SALARY (Lakhs Per Annum)
# Jobs are filtered out if salary_max < this value.
# Jobs with NO salary data are NOT filtered out (salary unknown ≠ low salary).
# Always in LPA — never USD.
salary_min_lpa: 25

# WORK MODE PREFERENCE
# Controls two things:
#   1. If "remote" is listed here → remote jobs pass location check regardless of city
#   2. Passed to LLM for context
# Options: remote | hybrid | onsite
# Tip: remove "onsite" if you won't relocate or commute daily.
work_mode:
  - remote
  - hybrid
  - onsite

# COMPANY TYPE FILTER
# "product" = keeps product companies, filters out IT services/outsourcing firms
#             (TCS, Infosys, Wipro, Accenture etc. are auto-detected and dropped)
# "service" = keeps service companies too (not recommended)
# Keep as [product] unless you want staffing/consulting roles.
company_type:
  - product

# COMPANIES TO ALWAYS SKIP
# Exact name match (case-insensitive). Add companies you've already applied to,
# had bad experiences with, or are just not interested in.
# Example:
#   exclude_companies:
#     - Flipkart
#     - Ola
exclude_companies: []

# YOUR NOTICE PERIOD (days)
# Used to flag notice-incompatible jobs.
# Jobs with "immediate joiner" / "no notice period" in JD get notice_compatible=False
# when this value > 0. Those jobs still appear in output — just flagged.
# Set to 0 if you can join immediately.
notice_days: 60

# YOUR RESUME SUMMARY
# This is the MOST IMPORTANT field for scoring quality.
# The LLM reads this first before scoring every job.
# Write it like a tight recruiter brief: years of exp, actual stack, domain,
# what kind of role/company you want. 3–5 sentences max.
# Bad example (too generic): "Senior engineer with 8 years experience."
# Good example:
#   8 yrs full-stack. React/TypeScript frontend, Node.js/Python backend.
#   Built fintech products at Series B startups. Strong in system design,
#   API design, and developer tooling. Want IC role at product company,
#   Series A–C, ESOP preferred, no pure frontend or maintenance work.
resume_summary: |
  Senior full-stack engineer with 8+ years experience.
  Strong in React, TypeScript, Node.js, Python.
  Prefers product companies with ESOP, Series A-C preferred.
